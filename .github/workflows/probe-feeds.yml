# Temporary diagnostic of the Reuters feeds (Google News); removed after use
name: Probe feeds
on:
  push:
    branches: [claude/magical-knuth-ksyhhz]
    paths: ['.github/probe/**', '.github/workflows/probe-feeds.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/probe/probe-feeds.mjs
