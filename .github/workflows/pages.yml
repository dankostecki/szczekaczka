# The same page on GitHub Pages: https://dankostecki.github.io/szczekaczka
# Only the static files are there; the news list and the WebSocket come from the
# Cloudflare Worker (it allows this origin in wrangler.jsonc, ALLOWED_ORIGINS).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /szczekaczka
          NEXT_PUBLIC_API_ORIGIN: https://szczekaczka.dancoder2025.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
